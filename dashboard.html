<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบทดสอบความรู้ Common Competency พยาบาล</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

:root{
  --navy-900:#0A2540;
  --navy-800:#0F3258;
  --navy-700:#16436F;
  --teal-500:#0E8388;
  --teal-600:#0B6C70;
  --teal-100:#E4F4F3;
  --bg:#F3F6F9;
  --surface:#FFFFFF;
  --line:#DFE7EE;
  --text:#16232F;
  --muted:#5C7086;
  --success:#178A5E;
  --success-bg:#E4F5EC;
  --warning:#B87A15;
  --warning-bg:#FBF0DD;
  --danger:#C23A4E;
  --danger-bg:#FBE7EA;
  --radius:14px;
  --shadow: 0 1px 2px rgba(10,37,64,0.06), 0 8px 24px rgba(10,37,64,0.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans Thai', sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Kanit', 'Noto Sans Thai', sans-serif;
  font-weight:600;
  letter-spacing:.1px;
}
a{color:var(--teal-600);}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  background:linear-gradient(135deg, var(--navy-900), var(--navy-700));
  color:#fff;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky; top:0; z-index:30;
  box-shadow:0 4px 16px rgba(10,37,64,.18);
}
.topbar .pulse-mark{
  width:34px; height:34px; border-radius:10px;
  background:rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.topbar .pulse-mark svg{width:20px; height:20px;}
.topbar .titles{line-height:1.25; min-width:0;}
.topbar .titles .system-name{font-family:'Kanit',sans-serif; font-weight:600; font-size:16px;}
.topbar .titles .hospital-name{font-size:12px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .spacer{flex:1;}
.topbar .nav-link{
  color:rgba(255,255,255,.85); text-decoration:none; font-size:13px;
  border:1px solid rgba(255,255,255,.25); padding:7px 12px; border-radius:999px;
  white-space:nowrap;
}
@media (hover: hover) and (pointer: fine){
  .topbar .nav-link:hover{background:rgba(255,255,255,.1);}
}

/* ---------- Layout ---------- */
.wrap{max-width:880px; margin:0 auto; padding:22px 16px 60px;}
.wrap.wide{max-width:1180px;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.card + .card{margin-top:16px;}

.eyebrow{
  font-size:12px; font-weight:700; color:var(--teal-600);
  text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;
}
.muted{color:var(--muted);}
.small{font-size:13px;}

/* ---------- Form controls ---------- */
label.field-label{display:block; font-size:13px; font-weight:600; color:var(--navy-800); margin:0 0 6px;}
input[type=text]{
  width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
  font-size:15px; font-family:inherit; background:#fff; color:var(--text);
}
input[type=text]:focus{outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px var(--teal-100);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
  font-size:15px; font-weight:600; font-family:inherit;
  transition:transform .08s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-500); color:#fff;}
.btn-primary:disabled{background:#B9C6D1; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--navy-800); border:1.5px solid var(--line);}
.btn-block{width:100%;}
@media (hover: hover) and (pointer: fine){
  .btn-primary:hover{background:var(--teal-600);}
  .btn-ghost:hover{border-color:var(--teal-500); color:var(--teal-600);}
}

/* ---------- Topic cards ---------- */
.topic-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
@media (max-width:560px){.topic-grid{grid-template-columns:1fr;}}
.topic-card{
  border:1.5px solid var(--line); border-radius:var(--radius); padding:18px;
  background:#fff; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
  transition:border-color .15s, box-shadow .15s;
}
@media (hover: hover) and (pointer: fine){
  .topic-card:hover{border-color:var(--teal-500); box-shadow:var(--shadow);}
}
.topic-card .tc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.topic-card .tc-name{font-family:'Kanit',sans-serif; font-weight:600; font-size:16px; color:var(--navy-900);}
.topic-card .tc-count{font-size:12.5px; color:var(--muted); margin-top:2px;}
.badge{
  font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.badge-pass{background:var(--success-bg); color:var(--success);}
.badge-fail{background:var(--danger-bg); color:var(--danger);}
.badge-neutral{background:var(--teal-100); color:var(--teal-600);}

/* ---------- Progress ---------- */
.progress-track{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal-500), var(--navy-700)); transition:width .25s ease;}
.progress-meta{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:8px;}

/* ---------- Question ---------- */
.q-section-tag{font-size:12px; color:var(--teal-600); font-weight:600; margin-bottom:8px;}
.q-text{font-size:17px; font-weight:600; line-height:1.55; color:var(--navy-900); margin:0 0 16px; white-space:pre-line;}
.q-image{width:100%; max-width:360px; border-radius:12px; border:1px solid var(--line); display:block; margin:0 auto 18px;}
.q-context{
  background:var(--teal-100); border:1px solid var(--line); border-left:4px solid var(--teal-500);
  border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.7; color:var(--navy-800);
  white-space:pre-line; margin:0 0 18px;
}
.options{display:flex; flex-direction:column; gap:10px;}
.option{
  display:flex; align-items:flex-start; gap:12px;
  border:1.5px solid var(--line); border-radius:12px; padding:13px 14px;
  cursor:pointer; transition:border-color .12s, background .12s;
}
@media (hover: hover) and (pointer: fine){
  .option:hover{border-color:var(--teal-500); background:var(--teal-100);}
}
.option.selected{border-color:var(--teal-500); background:var(--teal-100);}
.option .opt-letter{
  flex-shrink:0; width:26px; height:26px; border-radius:8px; background:var(--navy-100,#EEF3F8);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy-800);
  border:1.5px solid var(--line);
}
.option.selected .opt-letter{background:var(--teal-500); color:#fff; border-color:var(--teal-500);}
.option .opt-text{font-size:15px; line-height:1.5; padding-top:2px;}
.qa-review .option.correct{border-color:var(--success); background:var(--success-bg);}
.qa-review .option.wrong-pick{border-color:var(--danger); background:var(--danger-bg);}

.nav-row{display:flex; gap:10px; margin-top:22px;}
.nav-row .btn{flex:1;}

/* ---------- Radial gauge (signature element) ---------- */
.gauge-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
.gauge{position:relative; width:170px; height:170px;}
.gauge svg{transform:rotate(-90deg);}
.gauge .g-pct{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.gauge .g-pct .num{font-family:'Kanit',sans-serif; font-size:34px; font-weight:700; color:var(--navy-900); line-height:1;}
.gauge .g-pct .lbl{font-size:11.5px; color:var(--muted); margin-top:2px;}

.result-banner{
  display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; margin-top:14px;
  font-weight:600; font-size:15px;
}
.result-banner.pass{background:var(--success-bg); color:var(--success);}
.result-banner.fail{background:var(--danger-bg); color:var(--danger);}

.save-status{
  margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13.5px; text-align:center;
}
.save-status-ok{background:var(--success-bg); color:var(--success); font-weight:600;}
.save-status-error{background:var(--warning-bg); color:var(--warning); font-weight:600;}
.save-status-error button{margin:10px auto 0; display:block;}

/* ---------- Dashboard ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:800px){.kpi-grid{grid-template-columns:1fr 1fr;}}
.kpi-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.kpi-card .kpi-label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.kpi-card .kpi-value{font-family:'Kanit',sans-serif; font-size:28px; font-weight:700; color:var(--navy-900); margin-top:4px;}
.kpi-card .kpi-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}

.tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1.5px solid var(--line);}
.tab-btn{
  padding:10px 16px; border:none; background:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:14px;
  color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
}
.tab-btn.active{color:var(--teal-600); border-color:var(--teal-500);}

table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.data-table th{
  text-align:left; padding:10px 12px; background:var(--navy-900); color:#fff; font-weight:600;
  position:sticky; top:0;
}
table.data-table th:first-child{border-top-left-radius:8px;}
table.data-table th:last-child{border-top-right-radius:8px;}
table.data-table td{padding:10px 12px; border-bottom:1px solid var(--line);}
table.data-table tr:hover td{background:var(--teal-100);}
.table-scroll{overflow-x:auto; border-radius:10px; border:1px solid var(--line);}

.bar-row{display:grid; grid-template-columns:150px 1fr 60px; align-items:center; gap:10px; margin-bottom:12px;}
.bar-row .bar-label{font-size:13.5px; font-weight:600; color:var(--navy-800);}
.bar-track{height:14px; background:var(--line); border-radius:999px; overflow:hidden;}
.bar-fill{height:100%; border-radius:999px;}
.bar-row .bar-val{font-size:13px; font-weight:700; text-align:right; color:var(--navy-800);}

.insight-list{margin:0; padding-left:20px; font-size:14.5px; line-height:1.9; color:var(--navy-800);}
.insight-list li{margin-bottom:2px;}
.insight-list strong{color:var(--navy-900);}

.dist-row{margin-bottom:16px;}
.dist-row:last-child{margin-bottom:0;}
.dist-label{font-size:13.5px; font-weight:600; color:var(--navy-800); margin-bottom:6px;}
.dist-track{height:16px; border-radius:999px; overflow:hidden; display:flex; background:var(--line);}
.dist-seg{height:100%;}
.dist-legend{margin-top:6px;}

.search-row{display:flex; gap:10px; margin-bottom:16px;}
.search-row input{flex:1;}

.idp-box{
  margin-top:16px; padding:16px 18px; border-radius:12px;
  background:var(--warning-bg); border:1px solid #EFD9A8;
}
.idp-title{font-weight:700; font-size:13.5px; color:var(--warning); margin-bottom:10px;}
.idp-topic + .idp-topic{margin-top:12px; padding-top:12px; border-top:1px dashed #EFD9A8;}
.idp-topic-name{font-weight:700; font-size:14px; color:var(--navy-800); margin-bottom:4px;}
.idp-list{margin:0; padding-left:20px; font-size:13.5px; line-height:1.7; color:var(--navy-800);}

.empty-state{text-align:center; padding:40px 16px; color:var(--muted);}
.empty-state svg{margin-bottom:10px; opacity:.5;}

.spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--teal-100); border-top-color:var(--teal-500);
  animation:spin .8s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

.footer-note{text-align:center; color:var(--muted); font-size:12px; margin-top:28px;}

@media (max-width: 480px){
  .wrap{padding:16px 12px 50px;}
  .card{padding:16px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}

</style>
</head>

      {

        "question": "ผู้ป่วยได้รับยา Nicardipine 10 mg in NSS 100 ml ผ่านเครื่อง Infusion pump ด้วยอัตรา 15 ml/hr ผู้ป่วยรายนี้กำลังได้รับยาในขนาดกี่ mg/hr?",

      {

        "section": "การคำนวณยา",
        "question": "ผู้ป่วย Preeclampsia แพทย์สั่ง Magnesium Sulfate 4 g IV drip in 20 minutes ยาที่เตรียมมาคือ 10% MgSO4 100 ml (มีตัวยา 10 g). พยาบาลต้องตั้งอัตราการไหล (ml/hr) ที่เครื่อง Infusion pump เท่าใดเพื่อบริหารยา Loading dose นี้?",

        "options": [
          {

      }

  }

</script>
<script>
/* ============================ STATE ============================ */
const TOPIC_ORDER = ['pain','wound','ic','med'];
const TOPIC_ICON = {
  pain: '💊', wound: '🩹', ic: '🧼', med: '💉'
};

let state = {
  user: JSON.parse(sessionStorage.getItem('cc_user') || 'null'),
  results: JSON.parse(sessionStorage.getItem('cc_results') || '{}'), // {topicKey: {score,total,pct,passed}}
  currentTopic: null,
  currentQuestions: [],
  currentIndex: 0,
  answers: {}, // qid -> letter
  startTime: null
};

const app = document.getElementById('app');
document.getElementById('hospitalNameTop').textContent = CONFIG.HOSPITAL_NAME;

function saveUser(){ sessionStorage.setItem('cc_user', JSON.stringify(state.user)); }
function saveResults(){ sessionStorage.setItem('cc_results', JSON.stringify(state.results)); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================ ROUTER ============================ */
function render(){
  if(!state.user){
    renderLogin();
  } else if(!state.currentTopic){
    renderTopicSelect();
  } else if(state.currentQuestions.length && state.currentIndex < state.currentQuestions.length){
    renderQuestion();
  } else if(state.currentQuestions.length){
    renderResult();
  }
}

/* ============================ LOGIN ============================ */
function renderLogin(){
  app.innerHTML = `
  <div class="card" style="max-width:440px;margin:30px auto 0;">
    <div class="eyebrow">เริ่มต้นการทดสอบ</div>
    <h2 style="margin:0 0 4px;">ระบุตัวตนผู้เข้าทดสอบ</h2>
    <p class="muted small" style="margin-top:0;">กรอกข้อมูลเพื่อบันทึกผลคะแนนของท่านลงระบบ</p>
    <div style="margin-top:18px;">
      <label class="field-label">รหัสพนักงาน</label>
      <input type="text" id="inEmpId" placeholder="เช่น 12345" inputmode="numeric">
    </div>
    <div style="margin-top:14px;">
      <label class="field-label">ชื่อ-นามสกุล</label>
      <input type="text" id="inName" placeholder="เช่น สมหญิง ใจดี">
    </div>
    <div style="margin-top:14px;">
      <label class="field-label">แผนก / หน่วยงาน <span class="muted">(ไม่บังคับ)</span></label>
      <input type="text" id="inDept" placeholder="เช่น NICU">
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="submitLogin()">เข้าสู่ระบบทดสอบ</button>
  </div>`;
  document.getElementById('inEmpId').addEventListener('keydown', e=>{ if(e.key==='Enter') submitLogin(); });
  document.getElementById('inName').addEventListener('keydown', e=>{ if(e.key==='Enter') submitLogin(); });
}

function submitLogin(){
  const empId = document.getElementById('inEmpId').value.trim();
  const name = document.getElementById('inName').value.trim();
  const dept = document.getElementById('inDept').value.trim();
  if(!empId || !name){
    alert('กรุณากรอกรหัสพนักงานและชื่อ-นามสกุล');
    return;
  }
  state.user = {empId, name, dept};
  saveUser();
  render();
}

/* ============================ TOPIC SELECT ============================ */
function renderTopicSelect(){
  const cards = TOPIC_ORDER.map(key=>{
    const topic = QUIZ_DATA[key];
    const res = state.results[key];
    let badge = `<span class="badge badge-neutral">ยังไม่ทำ</span>`;
    if(res){
      badge = res.passed
        ? `<span class="badge badge-pass">ผ่าน ${res.pct}%</span>`
        : `<span class="badge badge-fail">ไม่ผ่าน ${res.pct}%</span>`;
    }
    return `
    <button class="topic-card" onclick="startTopic('${key}')">
      <div class="tc-top">
        <div>
          <div class="tc-name">${TOPIC_ICON[key]}  ${topic.label.split('(')[0].trim()}</div>
          <div class="tc-count">${topic.questions.length} ข้อ &middot; เกณฑ์ผ่าน ${Math.round(CONFIG.PASS_THRESHOLD*100)}%</div>
        </div>
        ${badge}
      </div>
    </button>`;
  }).join('');

  const doneCount = Object.keys(state.results).length;

  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">ผู้เข้าทดสอบ</div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <div>
        <h2 style="margin:0;">${escapeHtml(state.user.name)}</h2>
        <div class="muted small">รหัสพนักงาน ${escapeHtml(state.user.empId)}${state.user.dept ? ' &middot; '+escapeHtml(state.user.dept):''}</div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">เปลี่ยนผู้ใช้</button>
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">เลือกหัวข้อทดสอบ</div>
    <h2 style="margin:0 0 4px;">แบบทดสอบ 4 หัวข้อ</h2>
    <p class="muted small" style="margin-top:0;">ทำครบแล้ว ${doneCount}/4 หัวข้อ</p>
    <div class="topic-grid">${cards}</div>
  </div>
  <div class="footer-note">ผลคะแนนจะถูกบันทึกลงระบบส่วนกลางโดยอัตโนมัติเมื่อส่งคำตอบ</div>
  `;
}

function logout(){
  state.user = null;
  state.results = {};
  sessionStorage.removeItem('cc_user');
  sessionStorage.removeItem('cc_results');
  render();
}

function startTopic(key){
  state.currentTopic = key;
  state.currentQuestions = shuffle(QUIZ_DATA[key].questions);
  state.currentIndex = 0;
  state.answers = {};
  state.startTime = Date.now();
  render();
}

/* ============================ QUESTION ============================ */
function renderQuestion(){
  const q = state.currentQuestions[state.currentIndex];
  const total = state.currentQuestions.length;
  const pct = Math.round((state.currentIndex)/total*100);
  const selected = state.answers[q.id];

  const optsHtml = q.options.map(o=>`
    <div class="option ${selected===o.letter?'selected':''}" onclick="selectAnswer('${q.id}','${o.letter}')">
      <div class="opt-letter">${o.letter}</div>
      <div class="opt-text">${escapeHtml(o.text)}</div>
    </div>
  `).join('');

  app.innerHTML = `
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="eyebrow" style="margin:0;">${escapeHtml(QUIZ_DATA[state.currentTopic].label.split('(')[0].trim())}</div>
      <div class="muted small">ข้อ ${state.currentIndex+1} / ${total}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="card">
    ${q.section ? `<div class="q-section-tag">${escapeHtml(q.section)}</div>` : ''}
    <p class="q-text">${escapeHtml(q.question)}</p>
    ${q.image ? `<img class="q-image" src="${q.image}" alt="ภาพประกอบคำถาม">` : ''}
    ${q.context ? `<div class="q-context">${escapeHtml(q.context)}</div>` : ''}
    <div class="options">${optsHtml}</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="prevQuestion()" ${state.currentIndex===0?'disabled':''}>ย้อนกลับ</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${!selected?'disabled':''}>
        ${state.currentIndex===total-1 ? 'ส่งคำตอบ' : 'ข้อถัดไป'}
      </button>
    </div>
  </div>`;
}

function selectAnswer(qid, letter){
  state.answers[qid] = letter;
  renderQuestion();
}

function prevQuestion(){
  if(state.currentIndex>0){ state.currentIndex--; renderQuestion(); }
}

function nextQuestion(){
  const total = state.currentQuestions.length;
  if(state.currentIndex < total-1){
    state.currentIndex++;
    renderQuestion();
  } else {
    startSubmit();
  }
}

/* ============================ SUBMIT / SAVE ============================ */
function buildPayload(){
  const qs = state.currentQuestions;
  let score = 0;
  qs.forEach(q=>{ if(state.answers[q.id]===q.correct) score++; });
  const total = qs.length;
  const pct = Math.round((score/total)*1000)/10;
  const passed = (score/total) >= CONFIG.PASS_THRESHOLD;
  const durationSec = Math.round((Date.now()-state.startTime)/1000);
  return {
    result: {score, total, pct, passed},
    payload: {
      employeeId: state.user.empId,
      name: state.user.name,
      department: state.user.dept || '',
      topicKey: state.currentTopic,
      topicLabel: QUIZ_DATA[state.currentTopic].label,
      score, total, percentage: pct,
      passed: passed ? 'PASS' : 'FAIL',
      durationSec,
      answersJson: JSON.stringify(state.answers)
    }
  };
}

function renderSubmitting(){
  app.innerHTML = `
  <div class="card" style="text-align:center; padding:50px 20px;">
    <div class="spinner"></div>
    <p class="muted" style="margin-top:16px;">กำลังบันทึกคะแนนลงระบบ...</p>
  </div>`;
}

function startSubmit(){
  const {result, payload} = buildPayload();
  state.pendingResult = result;
  state.pendingPayload = payload;
  renderSubmitting();
  saveToSheet(payload);
}

function saveToSheet(payload){
  const body = Object.keys(payload).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(payload[k])).join('&');
  fetch(CONFIG.GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body
  }).then(()=>{
    finalizeSubmit(true);
  }).catch(()=>{
    finalizeSubmit(false);
  });
}

function finalizeSubmit(saveOk){
  state.results[state.currentTopic] = state.pendingResult;
  saveResults();
  state.saveStatus = saveOk ? 'success' : 'error';
  state.currentIndex = state.currentQuestions.length; // triggers result view
  render();
}

function retrySave(){
  renderSubmitting();
  saveToSheet(state.pendingPayload);
}

/* ============================ RESULT ============================ */

function renderResult(){
  const res = state.results[state.currentTopic];
  const gaugeColor = res.passed ? 'var(--success)' : (res.pct>=60 ? 'var(--warning)' : 'var(--danger)');
  const circumference = 2*Math.PI*72;
  const offset = circumference - (res.pct/100)*circumference;

  const saveBannerHtml = state.saveStatus === 'error'
    ? `<div class="save-status save-status-error">
         <span>⚠️ บันทึกลงระบบไม่สำเร็จ (อาจไม่มีอินเทอร์เน็ต) — คะแนนยังอยู่ในเครื่องนี้ กรุณาลองบันทึกอีกครั้ง</span>
         <button class="btn btn-primary" style="margin-top:10px;" onclick="retrySave()">บันทึกอีกครั้ง</button>
       </div>`
    : `<div class="save-status save-status-ok">✓ บันทึกคะแนนลงระบบเรียบร้อยแล้ว</div>`;

  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">ผลการทดสอบ</div>
    <h2 style="margin:0 0 12px;">${escapeHtml(QUIZ_DATA[state.currentTopic].label.split('(')[0].trim())}</h2>
    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="170" height="170" viewBox="0 0 170 170">
          <circle cx="85" cy="85" r="72" fill="none" stroke="var(--line)" stroke-width="14"/>
          <circle cx="85" cy="85" r="72" fill="none" stroke="${gaugeColor}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="g-pct">
          <div class="num">${res.pct}%</div>
          <div class="lbl">${res.score}/${res.total} ข้อ</div>
        </div>
      </div>
      <div class="result-banner ${res.passed?'pass':'fail'}">
        ${res.passed
          ? `✓ ผ่านเกณฑ์ (${Math.round(CONFIG.PASS_THRESHOLD*100)}%)`
          : `✕ ไม่ผ่านเกณฑ์ (ต้องได้ ${Math.round(CONFIG.PASS_THRESHOLD*100)}% ขึ้นไป)`}
      </div>
      ${saveBannerHtml}
    </div>
    <div class="nav-row" style="margin-top:20px;">
      <button class="btn btn-primary btn-block" onclick="backToTopics()">กลับหน้าเลือกหัวข้อ</button>
    </div>
  </div>
  `;
}

function backToTopics(){
  state.currentTopic = null;
  state.currentQuestions = [];
  state.currentIndex = 0;
  state.answers = {};
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
</body>
</html>
